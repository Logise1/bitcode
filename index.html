<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BitCode Runner</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- CodeMirror (Editor de texto) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/darcula.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closetag.min.js"></script>

    <!-- Pyodide (Intérprete de Python) -->
    <script src="https://cdn.jsdelivr.net/pyodide/v0.26.1/full/pyodide.js"></script>
    
    <!-- 
      NOTA: El script principal <script type="module"> se ha movido 
      al final del <body> para evitar errores de carga (TypeError).
    -->

    <style>
        /* Estilos de CodeMirror para que ocupe espacio */
        .CodeMirror {
            height: 100%;
            font-size: 16px;
        }
        /* Scrollbars customizadas */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1f2937; } /* gray-800 */
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; } /* gray-600 */
        ::-webkit-scrollbar-thumb:hover { background: #6b7280; } /* gray-500 */

        /* Transición de blur para el modal */
        #problem-list-view.blurred, #app-container.blurred {
            filter: blur(4px) grayscale(50%);
            pointer-events: none;
            user-select: none;
            transition: filter 0.2s ease-out;
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 font-sans h-full flex flex-col">

    <!-- 1. Pantalla de Carga Inicial -->
    <div id="loading-screen" class="absolute inset-0 z-50 flex flex-col items-center justify-center bg-gray-900">
        <svg class="animate-spin -ml-1 mr-3 h-10 w-10 text-blue-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
        <h1 class="text-2xl font-bold mt-4">BitCode</h1>
        <p id="loading-text" class="text-gray-400 mt-2">Inicializando intérprete de Python...</p>
    </div>

    <!-- 2. Vista de Lista de Problemas (Landing Page) -->
    <div id="problem-list-view" class="h-full flex-col hidden">
        <!-- Header -->
        <header class="bg-gray-800 shadow-md p-4 flex justify-between items-center w-full z-10">
            <h1 class="text-2xl font-bold text-white">BitCode</h1>
            <div class="flex items-center space-x-4">
                <span id="user-status-header" class="text-gray-300 text-sm">Invitado</span>
                <button id="login-btn-header" class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 transition-colors">Iniciar Sesión</button>
                <button id="logout-btn-header" class="hidden bg-gray-600 text-white px-4 py-2 rounded-md hover:bg-gray-700 transition-colors">Cerrar Sesión</button>
            </div>
        </header>

        <!-- Contenedor principal de la lista (con scroll) -->
        <main class="flex-1 overflow-y-auto p-6 md:p-10">
            <div class="max-w-7xl mx-auto">
                <h2 class="text-3xl font-bold text-white mb-6">Problemas de Python</h2>
                <div id="problem-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                    <!-- Las tarjetas de problemas se generan aquí -->
                </div>
            </div>
        </main>
    </div>


    <!-- 3. Vista del Editor de Problemas -->
    <div id="app-container" class="h-full flex-col hidden">
        <!-- Barra de botones superior -->
        <header class="bg-gray-800 shadow-md p-2 flex justify-between items-center w-full z-10">
            <button id="back-to-list-btn" class="text-sm bg-gray-700 text-white px-4 py-2 rounded-md hover:bg-gray-600 transition-colors flex items-center">
                <svg class="w-4 h-4 mr-2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5" />
                </svg>
                Volver a la lista
            </button>
            <div class="flex space-x-3">
                <button id="run-code" class="text-sm bg-blue-600 text-white font-medium px-4 py-2 rounded-md hover:bg-blue-700 transition-colors flex items-center disabled:opacity-50">
                    <svg class="w-4 h-4 mr-2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M5.25 5.653c0-.856.917-1.398 1.667-.986l11.54 6.347a1.125 1.125 0 0 1 0 1.972l-11.54 6.347a1.125 1.125 0 0 1-1.667-.986V5.653Z" />
                    </svg>
                    Ejecutar
                </button>
                <button id="submit-code" class="text-sm bg-green-600 text-white font-medium px-4 py-2 rounded-md hover:bg-green-700 transition-colors flex items-center disabled:opacity-50">
                    <svg class="w-4 h-4 mr-2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
                    </svg>
                    Enviar Solución
                </button>
            </div>
        </header>

        <!-- Contenido principal del editor (scrollable) -->
        <main class="flex-1 flex flex-col lg:flex-row overflow-hidden">
            <!-- Columna Izquierda: Descripción (con scroll) -->
            <div class="lg:w-2/5 p-6 overflow-y-auto">
                <h1 id="problem-title" class="text-2xl font-bold text-white mb-4">Cargando...</h1>
                <div id="problem-description" class="prose prose-invert prose-p:text-gray-300 prose-headings:text-white prose-li:text-gray-300 prose-code:text-yellow-300">
                    <p>Cargando descripción...</p>
                </div>
            </div>

            <!-- Columna Derecha: Editor y Consola (flex-col) -->
            <div class="lg:w-3/5 h-full flex flex-col">
                <!-- Editor -->
                <div class="flex-grow min-h-[300px]">
                    <textarea id="code-editor"></textarea>
                </div>
                <!-- Consola -->
                <div class="h-1/3 min-h-[150px] bg-gray-800 p-4 font-mono text-sm overflow-y-auto border-t-2 border-gray-700">
                    <pre id="console-output" class="whitespace-pre-wrap">¡Bienvenido a BitCode! Presiona "Ejecutar" para probar tu código.</pre>
                </div>
            </div>
        </main>
    </div>

    <!-- 4. Modal de Autenticación (Oculto) -->
    <div id="auth-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/50">
        <div class="bg-gray-800 w-full max-w-md p-8 rounded-lg shadow-xl relative">
            <button id="close-auth-modal" class="absolute top-4 right-4 text-gray-400 hover:text-white">
                <svg class="w-6 h-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
                </svg>
            </button>

            <h2 class="text-2xl font-bold text-white mb-2">¡Únete a BitCode!</h2>
            <p class="text-gray-400 mb-6">Regístrate o inicia sesión para guardar tu progreso.</p>

            <!-- Pestañas -->
            <div class="border-b border-gray-700 mb-6">
                <nav class="flex -mb-px space-x-6">
                    <button data-auth-tab="#auth-login" class="py-3 px-1 border-b-2 font-medium text-sm border-blue-500 text-blue-400">
                        Iniciar Sesión
                    </button>
                    <button data-auth-tab="#auth-register" class="py-3 px-1 border-b-2 font-medium text-sm border-transparent text-gray-400 hover:text-gray-300">
                        Registrarse
                    </button>
                </nav>
            </div>

            <!-- Contenido de Pestañas -->
            <div id="auth-content-wrapper">
                
                <!-- Iniciar Sesión -->
                <div id="auth-login" data-auth-content class="">
                    <form onsubmit="return false;">
                        <div class="mb-4">
                            <label for="login-email" class="block text-sm font-medium text-gray-300 mb-2">Email</label>
                            <input type="email" id="login-email" class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-md text-white focus:outline-none focus:ring-blue-500 focus:border-blue-500" placeholder="tu@email.com">
                        </div>
                        <div class="mb-6">
                            <label for="login-password" class="block text-sm font-medium text-gray-300 mb-2">Contraseña</label>
                            <input type="password" id="login-password" class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-md text-white focus:outline-none focus:ring-blue-500 focus:border-blue-500" placeholder="••••••••">
                        </div>
                        <p id="login-error" class="text-red-400 text-sm mb-4"></p>
                        <button id="login-btn" class="w-full bg-blue-600 text-white font-medium py-2 px-4 rounded-md hover:bg-blue-700 transition-colors">
                            Iniciar Sesión
                        </button>
                    </form>
                </div>

                <!-- Registrarse -->
                <div id="auth-register" data-auth-content class="hidden">
                    <form onsubmit="return false;">
                        <div class="mb-4">
                            <label for="register-email" class="block text-sm font-medium text-gray-300 mb-2">Email</label>
                            <input type="email" id="register-email" class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-md text-white focus:outline-none focus:ring-blue-500 focus:border-blue-500" placeholder="tu@email.com">
                        </div>
                        <div class="mb-6">
                            <label for="register-password" class="block text-sm font-medium text-gray-300 mb-2">Contraseña</label>
                            <input type="password" id="register-password" class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded-md text-white focus:outline-none focus:ring-blue-500 focus:border-blue-500" placeholder="Mínimo 6 caracteres">
                        </div>
                        <p id="reg-error" class="text-red-400 text-sm mb-4"></p>
                        <button id="register-btn" class="w-full bg-green-600 text-white font-medium py-2 px-4 rounded-md hover:bg-green-700 transition-colors">
                            Crear Cuenta
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 5. Elementos de Audio (Ocultos) -->
    <audio id="audio-enter" src="assets/enter.mp3" preload="auto"></audio>
    <audio id="audio-execute" src="assets/execute.mp3" preload="auto"></audio>
    <audio id="audio-complete" src="assets/complete.mp3" preload="auto"></audio>

    
    <!-- 
        ============================================================
        SCRIPT PRINCIPAL DE LA APLICACIÓN (MOVIDO AL FINAL)
        ============================================================
    -->
    <script type="module">
        // Importa las funciones que necesitas de los SDKs
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { 
            getAuth, 
            onAuthStateChanged, 
            signInWithEmailAndPassword, 
            createUserWithEmailAndPassword, 
            signOut
            // M O D I F I C A D O: Se eliminan signInAnonymously y signInWithCustomToken
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { 
            getFirestore, 
            doc, 
            getDoc, 
            setDoc
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        
        // --- Configuración de Firebase (la que proporcionaste) ---
        const firebaseConfig = {
          apiKey: "AIzaSyC9iNBJie4aHiW-igtdRN3farWRq9AlbIU",
          authDomain: "bitcode-9f43a.firebaseapp.com",
          projectId: "bitcode-9f43a",
          storageBucket: "bitcode-9f43a.firebasestorage.app",
          messagingSenderId: "990831599191",
          appId: "1:990831599191:web:17567e76c1cd6fe8ea0d12",
          measurementId: "G-X0MRZNY0LD"
        };
        
        // Inicializar Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        // Usar appId del config O el global __app_id si existe, para las rutas de Firestore
        const appId = typeof __app_id !== 'undefined' ? __app_id : firebaseConfig.appId;
        
        // --- 1. Variables Globales (Modificadas) ---
        let problems = []; 
        let pyodide;
        let editor;
        let currentProblemIndex = 0;
        
        // N U E V O: Estado de Autenticación y Progreso
        let userId = null;
        let isGuest = true; // Empezamos como invitado por defecto
        let userEmail = "Invitado";
        let solvedProblemsList = []; // Almacén temporal del progreso

        // Referencias a Audio HTML5
        const audioEnter = document.getElementById('audio-enter');
        const audioExecute = document.getElementById('audio-execute');
        const audioComplete = document.getElementById('audio-complete');

        // Elementos de la UI
        const loadingScreen = document.getElementById('loading-screen');
        const loadingText = document.getElementById('loading-text');
        
        // Vistas
        const problemListView = document.getElementById('problem-list-view');
        const appContainer = document.getElementById('app-container');
        
        // Vista de Lista
        const problemGrid = document.getElementById('problem-grid');
        const loginButtonHeader = document.getElementById('login-btn-header');
        const logoutButtonHeader = document.getElementById('logout-btn-header');
        const userStatusHeader = document.getElementById('user-status-header');

        // Vista de Editor
        const problemTitle = document.getElementById('problem-title');
        const problemDescription = document.getElementById('problem-description');
        const codeEditor = document.getElementById('code-editor');
        const consoleOutput = document.getElementById('console-output');
        
        // Botones
        const backToListBtn = document.getElementById('back-to-list-btn');
        const runButton = document.getElementById('run-code');
        const submitButton = document.getElementById('submit-code');
        
        // N U E V O: Elementos del Modal de Auth
        const authModal = document.getElementById('auth-modal');
        const closeAuthModalBtn = document.getElementById('close-auth-modal');
        const authTabs = document.querySelectorAll('[data-auth-tab]');
        const authContents = document.querySelectorAll('[data-auth-content]');
        const loginEmailField = document.getElementById('login-email');
        const loginPasswordField = document.getElementById('login-password');
        const loginBtn = document.getElementById('login-btn');
        const loginError = document.getElementById('login-error');
        const regEmailField = document.getElementById('register-email');
        const regPasswordField = document.getElementById('register-password');
        const regBtn = document.getElementById('register-btn');
        const regError = document.getElementById('register-error');

        
        // Iconos SVG para la lista
        const lockIcon = `<svg class="w-5 h-5 inline-block mr-1" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 0 0-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H6.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z" /></svg>`;
        const checkIcon = `<svg class="w-5 h-5 inline-block mr-1" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" /></svg>`;

        // --- 2. Funciones de Sonido (Usando HTML5 Audio) ---
        function playEnterSound() {
            if (audioEnter) {
                audioEnter.currentTime = 0;
                audioEnter.play().catch(e => console.warn("Audio 'enter' no se pudo reproducir."));
            }
        }

        function playExecuteSound() {
            if (audioExecute) {
                audioExecute.currentTime = 0;
                audioExecute.play().catch(e => console.warn("Audio 'execute' no se pudo reproducir."));
            }
        }

        function playCompleteSound() {
            if (audioComplete) {
                audioComplete.currentTime = 0;
                audioComplete.play().catch(e => console.warn("Audio 'complete' no se pudo reproducir."));
            }
        }
        
        // --- 3. Funciones de Autenticación y UI ---

        /**
         * Muestra/Oculta el modal de autenticación
         */
        function showAuthModal() { 
            authModal.classList.remove('hidden'); 
            problemListView.classList.add('blurred'); // Añadir blur
        }
        function hideAuthModal() { 
            authModal.classList.add('hidden'); 
            problemListView.classList.remove('blurred'); // Quitar blur
            // Limpiar errores
            loginError.innerText = "";
            regError.innerText = "";
        }

        /**
         * Actualiza la UI del header según el estado de auth
         */
        function updateAuthUI(email, isUserGuest) {
            userStatusHeader.innerText = email;
            if (isUserGuest) {
                loginButtonHeader.classList.remove('hidden');
                logoutButtonHeader.classList.add('hidden');
            } else {
                loginButtonHeader.classList.add('hidden');
                logoutButtonHeader.classList.remove('hidden');
            }
        }

        /**
         * Maneja el login
         */
        async function handleLogin() {
            const email = loginEmailField.value;
            const password = loginPasswordField.value;
            loginError.innerText = "";
            try {
                await signInWithEmailAndPassword(auth, email, password);
                hideAuthModal();
            } catch (error) {
                console.error("Error de login:", error.message);
                loginError.innerText = "Email o contraseña incorrectos.";
            }
        }

        /**
         * Maneja el registro
         */
        async function handleRegister() {
            const email = regEmailField.value;
            const password = regPasswordField.value;
            regError.innerText = "";
            if (password.length < 6) {
                regError.innerText = "La contraseña debe tener al menos 6 caracteres.";
                return;
            }
            try {
                await createUserWithEmailAndPassword(auth, email, password);
                hideAuthModal();
            } catch (error) {
                console.error("Error de registro:", error.message);
                if (error.code === 'auth/email-already-in-use') {
                    regError.innerText = "Este email ya está en uso.";
                } else {
                    regError.innerText = "Error al registrarse. Inténtalo de nuevo.";
                }
            }
        }

        /**
         * Maneja el logout
         */
        async function handleLogout() {
            try {
                await signOut(auth);
                // onAuthStateChanged se encargará de cambiar a modo invitado
            } catch (error) {
                console.error("Error al cerrar sesión:", error);
            }
        }

        // --- 4. M O D I F I C A D O: Funciones de Progreso (Híbridas) ---

        /**
         * Carga el progreso del usuario (localStorage o Firestore)
         */
        async function loadUserProgress() {
            if (isGuest) {
                // Cargar desde localStorage
                console.log("Cargando progreso de invitado (localStorage)...");
                const solved = localStorage.getItem('solvedProblems');
                if (solved) {
                    try {
                        solvedProblemsList = JSON.parse(solved);
                        if (!Array.isArray(solvedProblemsList)) solvedProblemsList = [];
                    } catch (e) {
                        solvedProblemsList = [];
                    }
                } else {
                    solvedProblemsList = [];
                }
                console.log("Progreso local cargado:", solvedProblemsList);
                return; // Importante salir aquí
            }

            // Si no es invitado, cargar de Firestore
            if (!userId) {
                console.warn("loadUserProgress: Logueado pero sin userId. Saltando.");
                solvedProblemsList = [];
                return;
            }
            
            console.log(`Cargando progreso de Firestore para userId: ${userId} ...`);
            // Ruta de Firestore: /artifacts/{appId}/users/{userId}/progress/main
            const docRef = doc(db, 'artifacts', appId, 'users', userId, 'progress', 'main');
            try {
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    // Fusionar progreso local (invitado) con el de Firestore al iniciar sesión
                    const localSolved = JSON.parse(localStorage.getItem('solvedProblems') || '[]');
                    const remoteSolved = data.solved || [];
                    const mergedSolved = [...new Set([...localSolved, ...remoteSolved])];
                    
                    solvedProblemsList = mergedSolved;
                    
                    // Si hubo fusión, guardar de nuevo en Firestore
                    if (mergedSolved.length > remoteSolved.length) {
                        await saveUserProgress(); 
                    }
                    // Limpiar el local storage después de la fusión
                    localStorage.removeItem('solvedProblems');

                } else {
                    // No existe documento remoto, usar el local y guardarlo
                    const localSolved = JSON.parse(localStorage.getItem('solvedProblems') || '[]');
                    solvedProblemsList = localSolved;
                    await saveUserProgress(); // Guardar el progreso local en la nube
                    localStorage.removeItem('solvedProblems');
                }
                console.log("Progreso de Firestore cargado/fusionado:", solvedProblemsList);
            } catch (error) {
                console.error("Error al cargar progreso de Firestore:", error);
                solvedProblemsList = [];
            }
        }

        /**
         * Guarda el progreso del usuario (localStorage o Firestore)
         */
        async function saveUserProgress() {
            if (isGuest) {
                // Guardar en localStorage
                console.log("Guardando progreso de invitado (localStorage)...");
                try {
                    localStorage.setItem('solvedProblems', JSON.stringify(solvedProblemsList));
                    console.log("Progreso local guardado.");
                } catch (e) {
                    console.error("Error al guardar en localStorage:", e);
                }
                return; // Importante salir aquí
            }

            // Si no es invitado, guardar en Firestore
            if (!userId) {
                console.warn("saveUserProgress: Logueado pero sin userId. Saltando guardado.");
                return;
            }

            console.log(`Guardando progreso en Firestore para userId: ${userId} ...`);
            const docRef = doc(db, 'artifacts', appId, 'users', userId, 'progress', 'main');
            try {
                // Usar setDoc con merge:true es más seguro, pero setDoc directo es más simple aquí
                await setDoc(docRef, { solved: solvedProblemsList });
                console.log("Progreso de Firestore guardado.");
            } catch (error) {
                console.error("Error al guardar progreso en Firestore:", error);
            }
        }

        /**
         * Devuelve la lista de progreso cargada en memoria.
         */
        function getSolvedProblems() {
            return solvedProblemsList;
        }


        // --- 5. Funciones de Lógica de la App (Modificadas) ---

        /**
         * Función principal de inicialización
         */
        async function main() {
            try {
                // Configurar el listener de Auth ANTES de cargar nada más
                // El listener se encargará de cargar el progreso inicial
                await setupAuthListener();

                // Cargar Pyodide y los problemas del JSON *en paralelo*
                const pyodidePromise = loadPyodide();
                const problemsPromise = fetch("my_problems.json")
                    .then(res => {
                        if (!res.ok) throw new Error(`Error HTTP! status: ${res.status}`);
                        return res.json();
                    })
                    .catch(e => {
                        console.error("Error al cargar 'my_problems.json':", e);
                        loadingText.innerText = `Error al cargar 'my_problems.json'. ¿Existe y es un JSON válido? \n${e}`;
                        throw e; // Detener la ejecución
                    });

                // Esperar a que ambas promesas se completen
                pyodide = await pyodidePromise;
                console.log("Pyodide cargado.");
                
                loadingText.innerText = "Cargando problemas...";
                problems = await problemsPromise;
                console.log("Problemas cargados:", problems);

                // Inicializar CodeMirror (solo una vez)
                editor = CodeMirror.fromTextArea(codeEditor, {
                    lineNumbers: true,
                    mode: "python",
                    theme: "darcula",
                    autoCloseBrackets: true,
                    autoCloseTags: true,
                    tabSize: 4,
                    indentUnit: 4
                });
                
                // Ocultar loader y mostrar la VISTA DE LISTA
                loadingScreen.classList.add('hidden');
                problemListView.classList.remove('hidden');
                
                // Renderizar la lista de problemas (ahora que el progreso ya se cargó)
                renderProblemList();

            } catch (error) {
                console.error("Error en la inicialización:", error);
                if (!loadingText.innerText.startsWith("Error")) {
                    loadingText.innerText = "Error fatal al cargar la aplicación. Revisa la consola.";
                }
            }
        }
        
        /**
         * M O D I F I C A D O: Listener de Auth (Sin login anónimo)
         * Ahora es una función 'async' y devuelve una promesa
         * para asegurar que el progreso se carga antes de continuar.
         */
        function setupAuthListener() {
            return new Promise((resolve) => {
                onAuthStateChanged(auth, async (user) => {
                    if (user && !user.isAnonymous) {
                        // Usuario está logueado (REAL)
                        userId = user.uid;
                        isGuest = false;
                        userEmail = user.email || `Usuario (${user.uid.substring(0, 5)})`;
                        
                        console.log(`Estado de Auth cambiado: ${userEmail}, Logueado`);
                        
                        updateAuthUI(userEmail, isGuest);
                        await loadUserProgress(); // Cargar progreso desde Firestore + Fusión
                        renderProblemList(); // Re-renderizar lista con el progreso
                        
                    } else {
                        // No hay usuario, MODO INVITADO
                        console.log("No hay usuario, cambiando a Modo Invitado (localStorage)...");
                        userId = null;
                        isGuest = true;
                        userEmail = "Invitado";
                        
                        updateAuthUI(userEmail, isGuest);
                        await loadUserProgress(); // Cargar progreso desde localStorage
                        renderProblemList(); // Renderizar lista con progreso local
                    }
                    resolve(); // Resuelve la promesa una vez que el estado de auth está listo
                });
            });
        }


        /**
         * Renderiza la cuadrícula de problemas
         */
        function renderProblemList() {
            // No renderizar si los problemas aún no se han cargado
            if (problems.length === 0) {
                console.log("RenderProblemList saltado, problemas no cargados.");
                return;
            }
            
            const solvedProblems = getSolvedProblems();
            const unlockedUpTo = solvedProblems.length; 
            
            problemGrid.innerHTML = ''; // Limpiar grid

            problems.forEach((problem, index) => {
                const isSolved = solvedProblems.includes(index);
                // M O D I F I C A D O: Desbloqueado si (es resuelto) O (es el siguiente)
                const isUnlocked = isSolved || (index === unlockedUpTo);

                let cardClasses = "bg-gray-800 p-6 rounded-lg shadow-lg flex flex-col justify-between h-48 transition-all";
                let cardIcon = "";
                let difficultyColor = "text-green-400";
                if (problem.difficulty === "Medio") difficultyColor = "text-yellow-400";
                if (problem.difficulty === "Difícil") difficultyColor = "text-red-400";

                
                if (isSolved) {
                    cardClasses += " border-l-4 border-green-500 cursor-pointer hover:bg-gray-700";
                    cardIcon = `<div class="font-medium text-sm flex items-center text-green-400">${checkIcon} Resuelto</div>`;
                } else if (isUnlocked) {
                    cardClasses += " border-l-4 border-blue-500 cursor-pointer hover:ring-2 hover:ring-blue-500";
                    cardIcon = `<div class="font-medium text-sm flex items-center text-blue-400">Resolver Ahora &rarr;</div>`;
                } else {
                    cardClasses += " opacity-50 cursor-not-allowed border-l-4 border-gray-600";
                    cardIcon = `<div class="font-medium text-sm flex items-center text-gray-500">${lockIcon} Bloqueado</div>`;
                }

                const card = document.createElement('div');
                card.className = cardClasses;
                
                card.innerHTML = `
                    <div>
                        <h3 class="text-lg font-bold text-white mb-2">${problem.title || 'Sin Título'}</h3>
                        <span class="text-sm ${difficultyColor}">
                            ${problem.difficulty || 'Fácil'}
                        </span>
                    </div>
                    ${cardIcon}
                `;

                if (isUnlocked) {
                    // M O D I F I C A D O: Lógica de clic actualizada
                    card.addEventListener('click', () => {
                        // Comprobar si es invitado Y está intentando acceder a problema > 0
                        if (isGuest && index > 0) {
                            showAuthModal(); // Pedir login/registro
                        } else {
                            showEditorView(index); // Permitir acceso
                        }
                    });
                }

                problemGrid.appendChild(card);
            });
        }

        /**
         * Oculta la lista y muestra el editor para un problema específico.
         */
        function showEditorView(index) {
            playEnterSound(); // Sonido al entrar
            problemListView.classList.add('hidden');
            appContainer.classList.remove('hidden');
            currentProblemIndex = index;
            loadProblem(index);
            // Refrescar CodeMirror DESPUÉS de que sea visible
            setTimeout(() => editor.refresh(), 0);
        }

        /**
         * Oculta el editor y muestra la lista de problemas.
         */
        function showProblemListView() {
            appContainer.classList.add('hidden');
            problemListView.classList.remove('hidden');
            renderProblemList(); // Re-renderizar para mostrar el nuevo estado (ej. problema resuelto)
        }


        /**
         * Carga un problema en la UI del Editor.
         */
        function loadProblem(index) {
            if (index < 0 || index >= problems.length) {
                console.error("Índice de problema inválido:", index);
                return;
            }
            
            const problem = problems[index];
            if (!problem) {
                console.error("No se encontró el problema en el índice:", index);
                return;
            }

            problemTitle.innerText = problem.title || "Problema sin título";
            problemDescription.innerHTML = problem.description || "<p>Sin descripción.</p>";
            
            // Añadir la dificultad a la descripción
            const difficulty = problem.difficulty || "Fácil";
            let difficultyColor = "text-green-400"; // Fácil
            if (difficulty === "Medio") {
                difficultyColor = "text-yellow-400";
            } else if (difficulty === "Difícil") {
                difficultyColor = "text-red-400";
            }
            problemTitle.innerHTML += ` <span class="text-sm ${difficultyColor} font-normal">(${difficulty})</span>`;

            editor.setValue(problem.starterCode || "# Escribe tu código aquí\n");
            consoleOutput.innerText = `Problema ${index + 1} cargado.`;
        }

        /**
         * Habilita o deshabilita los botones.
         */
        function setButtonsDisabled(disabled) {
            runButton.disabled = disabled;
            submitButton.disabled = disabled;
        }

        /**
         * Ejecuta el código del usuario SIN los tests.
         */
        async function runCode() {
            playExecuteSound(); // Sonido al ejecutar
            const userCode = editor.getValue();
            consoleOutput.innerText = "Ejecutando...";
            setButtonsDisabled(true);

            try {
                // Limpiar stdout/stderr de Pyodide
                await pyodide.runPythonAsync(`
                    import sys, io
                    sys.stdout = io.StringIO()
                    sys.stderr = io.StringIO()
                `);
                
                // Ejecutar el código del usuario
                let result = await pyodide.runPythonAsync(userCode);
                
                // Capturar salidas
                let stdout = await pyodide.runPythonAsync("sys.stdout.getvalue()");
                let stderr = await pyodide.runPythonAsync("sys.stderr.getvalue()");
                
                if (stderr) {
                    consoleOutput.innerHTML = `<span class="text-red-500">Error:</span>\n${stderr}`;
                } else if (stdout) {
                    consoleOutput.innerText = stdout;
                } else if (result !== undefined && result !== null) {
                    // Si no hay print, mostrar el 'return' de la última expresión
                    consoleOutput.innerText = String(result);
                } else {
                    consoleOutput.innerText = "(Sin salida)";
                }

            } catch (e) {
                consoleOutput.innerHTML = `<span class="text-red-500">Error del intérprete:</span>\n${e.message}`;
            }

            setButtonsDisabled(false);
        }

        /**
         * M O D I F I C A D O: Ejecuta el código del usuario CON los tests
         * (Ahora es async y guarda en (localStorage O Firestore))
         */
        async function submitCode() {
            playExecuteSound(); // Sonido al ejecutar
            const userCode = editor.getValue();
            const problem = problems[currentProblemIndex];
            
            if (!problem.testCode) {
                consoleOutput.innerHTML = `<span class="text-yellow-500">Este problema no tiene tests definidos.</span>`;
                return;
            }

            consoleOutput.innerText = "Ejecutando pruebas...";
            setButtonsDisabled(true);

            // Indentar el código del usuario y el código de prueba
            const indentedUserCode = userCode.replace(/^/gm, '    ');
            const indentedTestCode = problem.testCode.replace(/^/gm, '    ');

            const fullScript = `
import sys, io
sys.stdout = io.StringIO()
sys.stderr = io.StringIO()
output = ""
try:
    # --- Código del Usuario ---
${indentedUserCode}
    # --- Fin del Código del Usuario ---

    # --- Arnés de Pruebas ---
${indentedTestCode}
    # --- Fin del Arnés de Pruebas ---
except Exception as e:
    # Capturar errores de sintaxis o runtime
    print(f"__FAILURE__: Error de sintaxis o ejecución: {e}")

# Obtener salidas
stdout_value = sys.stdout.getvalue()
stderr_value = sys.stderr.getvalue()

if stderr_value:
    output = f"__FAILURE__: Error de Runtime:\\n{stderr_value}"
else:
    output = stdout_value

# Devolver un diccionario para JS
{'output': output}
            `;
            
            try {
                let resultProxy = await pyodide.runPythonAsync(fullScript);
                let result = resultProxy.toJs();
                resultProxy.destroy();
                
                let output = result.output;

                if (output.includes("__SUCCESS__")) {
                    playCompleteSound(); // Sonido de éxito
                    consoleOutput.innerHTML = `<span class="text-green-400 font-bold">¡Solución Aceptada!</span>\nTodos los tests pasaron.`;
                    
                    // --- M O D I F I C A D O: Guardar Progreso (Híbrido) ---
                    if (!solvedProblemsList.includes(currentProblemIndex)) {
                        solvedProblemsList.push(currentProblemIndex);
                        solvedProblemsList.sort((a, b) => a - b); // Mantenerlos ordenados
                        await saveUserProgress(); // Guardar (en localStorage o Firestore)
                    }
                    
                    // Volver a la lista después de 2 segundos
                    setTimeout(showProblemListView, 2000); 

                } else if (output.includes("__FAILURE__:")) {
                    let errorMsg = output.split("__FAILURE__:")[1] || "Tests fallidos.";
                    consoleOutput.innerHTML = `<span class="text-red-400 font-bold">Solución Incorrecta:</span>\n${errorMsg.trim()}`;
                } else {
                    consoleOutput.innerHTML = `<span class="text-yellow-500">Salida inesperada del test (sin __SUCCESS__):</span>\n${output || '(Sin salida)'}`;
                }

            } catch (e) {
                consoleOutput.innerHTML = `<span class="text-red-500">Error del intérprete:</span>\n${e.message}`;
            }

            setButtonsDisabled(false);
        }

        // --- 6. Event Listeners ---
        // (Asegurarse de que los elementos existen antes de añadir listeners)
        
        backToListBtn.addEventListener('click', showProblemListView);
        runButton.addEventListener('click', runCode);
        submitButton.addEventListener('click', submitCode);

        // Listeners de Auth
        loginButtonHeader.addEventListener('click', showAuthModal);
        logoutButtonHeader.addEventListener('click', handleLogout);
        closeAuthModalBtn.addEventListener('click', hideAuthModal);
        loginBtn.addEventListener('click', handleLogin);
        regBtn.addEventListener('click', handleRegister);
        
        // Listener para las pestañas del modal
        authTabs.forEach(tab => {
            tab.addEventListener('click', () => {
                const target = document.querySelector(tab.dataset.authTab);
                
                authContents.forEach(content => content.classList.add('hidden'));
                target.classList.remove('hidden');
                
                authTabs.forEach(t => t.classList.replace('border-blue-500', 'text-blue-400', 'border-transparent', 'text-gray-400'));
                tab.classList.replace('border-transparent', 'text-gray-400', 'border-blue-500', 'text-blue-400');
                
                // Limpiar errores al cambiar de pestaña
                loginError.innerText = "";
                regError.innerText = "";
            });
        });

        // --- 7. Ejecución ---
        main();

    </script>
</body>
